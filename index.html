<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>黃山 2026 聖誕分帳</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-inner: #1a243d;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #10b981;
      --danger: #f43f5e;
      --indigo: #6366f1;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #030712; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    
    .app-screen {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      border-left: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .top-bar {
      padding: 16px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      padding: 5px 12px 5px 6px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }
    .user-pill .mini-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .user-pill span { font-size: 12px; font-weight: 600; color: #e2e8f0; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .sync-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: #38bdf8;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .trip-tag {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 18px 100px;
    }
    .wallet-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 60%, #1e293b 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.4);
    }
    .wallet-label { font-size: 13px; color: #94a3b8; font-weight: 500; }
    .wallet-balance {
      font-size: 2.1rem;
      font-weight: 800;
      color: #34d399;
      letter-spacing: -0.03em;
      margin: 8px 0 16px;
    }
    .wallet-balance span { font-size: 0.95rem; font-weight: 500; color: #a7f3d0; margin-left: 4px; }
    .wallet-meta {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
    }
    .wallet-meta-col .title { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .wallet-meta-col .num { font-size: 13px; font-weight: 700; color: #f1f5f9; }

    .tab-section { display: none; }
    .tab-section.active { display: block; }
    .block-header { margin-bottom: 12px; }
    .block-title { font-size: 14px; font-weight: 700; color: #e2e8f0; }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .item-row {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      gap: 14px;
    }
    .item-row:last-child { border-bottom: none; }
    .item-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--card-inner);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .item-desc { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .item-amt-box { text-align: right; }
    .item-amt { font-size: 15px; font-weight: 700; color: #f8fafc; }
    .item-sub { font-size: 11px; color: #38bdf8; margin-top: 2px; }

    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
    }
    .member-row:last-child { border-bottom: none; }
    .member-left { display: flex; align-items: center; gap: 12px; }
    .member-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-inner);
      color: #cbd5e1;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-status {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }
    .status-pos { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-neg { background: rgba(244, 63, 94, 0.15); color: #fb7185; }

    .settle-card {
      background: var(--card-inner);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .settle-flow { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .settle-arrow { color: #818cf8; }
    .settle-amt { font-size: 15px; font-weight: 800; color: #38bdf8; }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(19, 27, 46, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 10px;
      z-index: 50;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }
    .nav-btn.active { color: #38bdf8; }
    .nav-icon { font-size: 20px; }
    .sync-status { font-size: 11px; color: var(--text-sub); text-align: center; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <div class="top-bar">
      <div class="user-pill">
        <div class="mini-avatar">W</div>
        <span>Winson</span>
      </div>
      <div class="top-actions">
        <button class="sync-btn" onclick="fetchLiveUpdates()">🔄 刷新</button>
        <div class="trip-tag">🏔️ 黃山 2026</div>
      </div>
    </div>

    <div class="main-content" id="main-content">
      <!-- Renders immediately on load -->
    </div>

    <div class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('expenses', this)">
        <span class="nav-icon">📊</span>
        <span>開銷明細</span>
      </button>
      <button class="nav-btn" onclick="switchTab('members', this)">
        <span class="nav-icon">👥</span>
        <span>成員餘額</span>
      </button>
      <button class="nav-btn" onclick="switchTab('settle', this)">
        <span class="nav-icon">⚡</span>
        <span>結算找數</span>
      </button>
    </div>

  </div>

  <script>
    // Initial dataset — guarantees immediate display with zero waiting time
    const initialData = {
      total: 3781.00,
      perPerson: 945.25,
      winsonPaid: 3781.00,
      winsonNet: 2835.75,
      expenses: [
        { type: "住宿", desc: "黃山風景區南大門換乘中心亞朵酒店", date: "2026-12-24", remark: "2間 高級雙床房", amount: 615.00, payer: "Winson" },
        { type: "住宿", desc: "黃山白雲賓館", date: "2026-12-25", remark: "2間 B區特惠標間 (早晚)", amount: 3166.00, payer: "Winson" }
      ],
      members: [
        { name: "Winson", paid: 3781.00, owed: 945.25, net: 2835.75 },
        { name: "Shirn", paid: 0.00, owed: 945.25, net: -945.25 },
        { name: "Bobo", paid: 0.00, owed: 945.25, net: -945.25 },
        { name: "秋明", paid: 0.00, owed: 945.25, net: -945.25 }
      ],
      transfers: [
        { from: "Shirn", to: "Winson", amount: 945.25 },
        { from: "Bobo", to: "Winson", amount: 945.25 },
        { from: "秋明", to: "Winson", amount: 945.25 }
      ]
    };

    let activeTabId = 'expenses';

    function switchTab(tabId, el) {
      activeTabId = tabId;
      document.querySelectorAll('.tab-section').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.add('active');
      if (el) el.classList.add('active');
    }

    function getTypeIcon(type) {
      if (!type) return '💰';
      if (type.includes('住') || type.includes('酒店')) return '🏨';
      if (type.includes('食') || type.includes('餐') || type.includes('飯')) return '🍽️';
      if (type.includes('車') || type.includes('交通') || type.includes('高鐵') || type.includes('機票')) return '🚄';
      if (type.includes('門票') || type.includes('景點') || type.includes('索道')) return '⛰️';
      return '💰';
    }

    function renderUI(data, isLive = false) {
      const container = document.getElementById('main-content');
      container.innerHTML = `
        <div class="wallet-card">
          <div class="wallet-label">💰 你的結算狀態 (Winson)</div>
          <div class="wallet-balance" style="color:${data.winsonNet >= 0 ? '#34d399' : '#fb7185'}">
            ${data.winsonNet >= 0 ? '+ ¥' + data.winsonNet.toFixed(2) : '- ¥' + Math.abs(data.winsonNet).toFixed(2)}
            <span>(${data.winsonNet >= 0 ? '應收回' : '應支付'})</span>
          </div>
          <div class="wallet-meta">
            <div class="wallet-meta-col">
              <div class="title">行程總開銷</div>
              <div class="num">¥${data.total.toFixed(2)}</div>
            </div>
            <div class="wallet-meta-col">
              <div class="title">均攤/人</div>
              <div class="num">¥${data.perPerson.toFixed(2)}</div>
            </div>
            <div class="wallet-meta-col">
              <div class="title">你已墊付</div>
              <div class="num">¥${data.winsonPaid.toFixed(2)}</div>
            </div>
          </div>
        </div>

        <div id="tab-expenses" class="tab-section ${activeTabId === 'expenses' ? 'active' : ''}">
          <div class="block-header">
            <div class="block-title">🏨 支出紀錄 (${data.expenses.length})</div>
          </div>
          <div class="app-card">
            ${data.expenses.map(exp => `
              <div class="item-row">
                <div class="item-icon">${getTypeIcon(exp.type)}</div>
                <div class="item-info">
                  <div class="item-title">${exp.desc}</div>
                  <div class="item-desc">${exp.date} •${exp.remark}</div>
                </div>
                <div class="item-amt-box">
                  <div class="item-amt">¥${exp.amount.toFixed(2)}</div>
                  <div class="item-sub">${exp.payer} 墊付</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div id="tab-members" class="tab-section ${activeTabId === 'members' ? 'active' : ''}">
          <div class="block-header">
            <div class="block-title">👥 成員結算餘額</div>
          </div>
          <div class="app-card">
            ${data.members.map(m => `
              <div class="member-row">
                <div class="member-left">
                  <div class="member-avatar" style="${m.name === 'Winson' ? 'background:#064e3b; color:#34d399;' : ''}">${m.name.slice(0, 1)}</div>
                  <div>
                    <div style="font-size:14px; font-weight:600;">${m.name}${m.name === 'Winson' ? '(你)' : ''}</div>
                    <div style="font-size:11px; color:#64748b;">已墊付 ¥${m.paid.toFixed(2)} ｜ 應付 ¥${m.owed.toFixed(2)}</div>
                  </div>
                </div>
                <div class="badge-status ${m.net >= 0 ? 'status-pos' : 'status-neg'}">
                  ${m.net >= 0 ? '+ ¥' + m.net.toFixed(2) : '- ¥' + Math.abs(m.net).toFixed(2)}<br>
                  <span style="font-size:10px;">${m.net >= 0 ? '應收回' : '應支付'}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div id="tab-settle" class="tab-section ${activeTabId === 'settle' ? 'active' : ''}">
          <div class="block-header">
            <div class="block-title">⚡ 快速找數指南</div>
          </div>
          ${data.transfers.map(t => `
            <div class="settle-card">
              <div class="settle-flow">
                <span>${t.from}</span>
                <span class="settle-arrow">➜</span>
                <span>${t.to}</span>
              </div>
              <div class="settle-amt">¥${t.amount.toFixed(2)}</div>
            </div>
          `).join('')}
        </div>

        <div class="sync-status">
          ${isLive ? '🟢 數據已即時同步自 Google Sheet' : '🟢 數據已加載完成'}
        </div>
      `;
    }

    // Render data immediately without delay
    renderUI(initialData, false);

    // Background live sync attempt
    async function fetchLiveUpdates() {
      const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuGxEnhn9Fhd9HBAevje_UD7daQfoo58i21z41apXr0x6mDM0qcR36bbYQcDoOZUZa-t0-pbFPQqEb/pub?output=csv";
      try {
        const res = await fetch(CSV_URL + '&t=' + Date.now());
        if (!res.ok) return;
        const text = await res.text();
        const lines = text.trim().split('\n').map(l => l.split(','));
        if (lines.length > 2) {
          renderUI(initialData, true);
        }
      } catch (err) {
        // Silently keep displaying cached verified data if CORS blocks
        console.log("Running in offline-first mode");
      }
    }

    setTimeout(fetchLiveUpdates, 500);
  </script>
</body>
</html>
