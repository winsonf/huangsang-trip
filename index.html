<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 聖誕黃山之旅 | 行程與費用分攤</title>
  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #151f32;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --green: #10b981;
      --red: #f43f5e;
      --cyan: #06b6d4;
      --orange: #f59e0b;
      --purple: #a855f7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e293b;
      padding: 6px 12px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    .user-avatar {
      width: 26px;
      height: 26px;
      background: #059669;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: bold;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .btn-top {
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-top:active {
      transform: scale(0.96);
    }

    .spin {
      animation: rotate 0.8s linear infinite;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Tabs */
    .nav-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: #111827;
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
    }

    .nav-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 10px 4px;
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      transition: all 0.25s ease;
    }

    .nav-tab.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    /* Summary Card */
    .summary-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .summary-title {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-balance {
      font-size: 32px;
      font-weight: 800;
      color: var(--green);
      margin-bottom: 20px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .summary-balance.negative {
      color: var(--red);
    }

    .summary-balance-desc {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 16px;
      text-align: center;
    }

    .grid-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .grid-col:not(:last-child) {
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }

    .grid-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .grid-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
    }

    /* Section Titles */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 700;
      margin-top: 8px;
      color: var(--text);
    }

    /* Expense List */
    .expense-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .expense-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .expense-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .expense-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .expense-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expense-meta {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .expense-right {
      text-align: right;
      flex-shrink: 0;
    }

    .expense-amount {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .expense-payer {
      font-size: 12px;
      color: var(--accent);
      margin-top: 2px;
    }

    /* Itinerary */
    .itinerary-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-badge {
      background: var(--accent);
      color: white;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
    }

    .day-date {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .itinerary-item {
      padding: 10px 12px;
      background: #0f172a;
      border-radius: 10px;
      border-left: 3px solid var(--accent);
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .itinerary-item.transport { border-color: var(--cyan); }
    .itinerary-item.hotel { border-color: var(--orange); }
    .itinerary-item.food { border-color: var(--purple); }
    .itinerary-item.spot { border-color: var(--green); }

    /* Balances */
    .balance-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .member-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .member-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #334155;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: bold;
    }

    .member-details {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .member-name {
      font-size: 14px;
      font-weight: 700;
    }

    .member-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .balance-net {
      text-align: right;
    }

    .balance-amount {
      font-size: 15px;
      font-weight: 800;
    }

    .balance-badge {
      font-size: 11px;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Settle Up */
    .settle-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .settle-flow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .settle-arrow {
      color: var(--accent);
      font-size: 16px;
    }

    .settle-amount {
      font-size: 16px;
      font-weight: 800;
      color: var(--green);
    }

    /* Footer & Status */
    .sync-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      margin: 12px 0 6px 0;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: #64748b;
      margin-top: 10px;
    }

    /* User Switch Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-content {
      background: #1e293b;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 360px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 700;
      text-align: center;
    }

    .modal-users {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-user-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-user-btn.active {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="user-pill" onclick="openUserModal()">
        <div class="user-avatar" id="topAvatar">W</div>
        <span id="topUserName">Winson</span>
        <span style="font-size: 10px; opacity: 0.6;">▼</span>
      </div>
      <div class="top-actions">
        <button class="btn-top" onclick="triggerRefresh()">
          <span id="refreshIcon">🔄</span> 刷新
        </button>
        <div class="btn-top" style="cursor: default;">
          🏔️ 2026 聖誕
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="switchTab('itinerary', this)">🗓️ 行程</button>
      <button class="nav-tab" onclick="switchTab('expense', this)">📊 開銷</button>
      <button class="nav-tab" onclick="switchTab('balances', this)">👥 餘額</button>
      <button class="nav-tab" onclick="switchTab('settle', this)">⚡ 找數</button>
    </div>

    <!-- Shared Top Summary Card -->
    <div class="summary-card">
      <div class="summary-title">
        <span>💰</span> 你的結算狀態 (<span id="summaryUserName">Winson</span>)
      </div>
      <div class="summary-balance" id="summaryNetBalance">
        + ¥3,887.25 <span class="summary-balance-desc" id="summaryNetDesc">(應收回)</span>
      </div>
      <div class="summary-grid">
        <div class="grid-col">
          <span class="grid-label">行程總開銷</span>
          <span class="grid-value" id="totalExpenseVal">¥5,183.00</span>
        </div>
        <div class="grid-col">
          <span class="grid-label">均攤/人</span>
          <span class="grid-value" id="perPersonVal">¥1,295.75</span>
        </div>
        <div class="grid-col">
          <span class="grid-label">你已墊付</span>
          <span class="grid-value" id="userPaidVal">¥5,183.00</span>
        </div>
      </div>
    </div>

    <!-- Tab 1: 行程 -->
    <div id="tab-itinerary">
      <div class="section-header">
        <span>🗺️ 行程規劃 (5 天)</span>
      </div>
      <div class="itinerary-list" id="itineraryContainer" style="margin-top: 12px;"></div>
    </div>

    <!-- Tab 2: 開銷 -->
    <div id="tab-expense" style="display: none;">
      <div class="section-header">
        <span>🏨 支出紀錄 (<span id="expenseCount">3</span>)</span>
      </div>
      <div class="expense-list" id="expenseContainer" style="margin-top: 12px;"></div>
    </div>

    <!-- Tab 3: 餘額 -->
    <div id="tab-balances" style="display: none;">
      <div class="section-header">
        <span>👥 成員結算餘額</span>
      </div>
      <div class="expense-list" id="balancesContainer" style="margin-top: 12px;"></div>
    </div>

    <!-- Tab 4: 找數 -->
    <div id="tab-settle" style="display: none;">
      <div class="section-header">
        <span>⚡ 快速找數指南 (Splitwise 最簡結算)</span>
      </div>
      <div class="expense-list" id="settleContainer" style="margin-top: 12px;"></div>
    </div>

    <!-- Sync status -->
    <div class="sync-status">
      <div class="status-dot" id="statusDot"></div>
      <span id="syncText">數據已即時同步自 Google Sheet</span>
    </div>

    <!-- Footer -->
    <div class="footer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="#00c7b7">
        <path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm4.24 16L12 15.45 7.77 18l1.12-4.81-3.73-3.23 4.92-.42L12 5l1.92 4.53 4.92.42-3.73 3.23L16.23 18z"/>
      </svg>
      <span>Powered by Netlify</span>
    </div>
  </div>

  <!-- User Selector Modal -->
  <div class="modal-overlay" id="userModal" onclick="closeUserModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title">選擇目前檢視的成員</div>
      <div class="modal-users" id="modalUserList"></div>
    </div>
  </div>

  <script>
    const SPREADSHEET_ID = '1iZyozCgyjVUB7bGz-AmnQfYgAdv-XwzwnzYilRDehKc';
    const MEMBERS = ['Winson', 'Shirn', 'Bobo', '秋明'];
    let currentUser = localStorage.getItem('active_user') || 'Winson';

    // 初始備援資料 (精確的 3 筆開銷)
    let state = {
      expenses: [
        { type: '住宿', date: '2026-12-24', desc: '黃山風景區南大門換乘中心亞朵酒店', amount: 615, paidBy: 'Winson', remark: '2間 高級雙床房 (1晚)' },
        { type: '住宿', date: '2026-12-25', desc: '黃山白雲賓館', amount: 3166, paidBy: 'Winson', remark: '2間 B區特惠標間 (含早晚餐)' },
        { type: '住宿', date: '2026-12-26', desc: '展楓酒店(景德鎮陶溪川北路店)', amount: 1402, paidBy: 'Winson', remark: '2間 豪華雙床房 (2晚) 訂單編號 1128151957288290' }
      ],
      itinerary: [
        {
          day: 'D1', date: '24/12/2026 (Thur)', items: [
            { text: 'G902 11:35 to 17:06 香港西九龍 to 黃山北', type: 'transport', icon: '🚅' },
            { text: '黄山风景区南大门换乘中心亚朵酒店 (RMB 315)', type: 'hotel', icon: '🏨' },
            { text: 'Dinner at 徽菜館 2220', type: 'food', icon: '📍' }
          ]
        },
        {
          day: 'D2', date: '25/12/2026 (Fri)', items: [
            { text: '06:00 wake up, 06:30 leave hotel, 新國線景區交通(單程13元) or Taxi to 云谷寺站 (30 Mins)', type: 'transport', icon: '🚌' },
            { text: '白鵝新站—竪琴松—始信峰—清涼台—獅子峰頂——西海—排雲亭—飛來石—光明頂 (日落)—白雲賓館', type: 'spot', icon: '⛰️' },
            { text: '白雲賓館 (RMB 1580)', type: 'hotel', icon: '🏨' }
          ]
        },
        {
          day: 'D3', date: '26/12/2026 (Sat)', items: [
            { text: '05:30 Wake up, 06:00 出發到光明頂看日出', type: 'spot', icon: '🌅' },
            { text: '白雲賓館—光明頂 —步仙桥—海心亭—鰲魚峰—一線天—玉屏樓—迎客松—玉屏索道—慈光閣', type: 'spot', icon: '⛰️' },
            { text: '慈光閣— 酒店 拿行李', type: 'spot', icon: '🎒' },
            { text: '黃山北 — 景德镇北 Around 18:00 G1499 16:53 ~ 17:34', type: 'transport', icon: '🚅' },
            { text: '展楓酒店(景德鎮陶溪川北路店)', type: 'hotel', icon: '🏨' },
            { text: '中山北路步行街', type: 'food', icon: '🍜' }
          ]
        },
        {
          day: 'D4', date: '27/12/2026 (Sun)', items: [
            { text: '上午 陶博城', type: 'spot', icon: '🏺' },
            { text: '下午 景德镇古窑民俗博览区', type: 'spot', icon: '🏺' },
            { text: '黃昏 陶溪川文创街区', type: 'spot', icon: '🎨' },
            { text: '展楓酒店(景德鎮陶溪川北路店)', type: 'hotel', icon: '🏨' }
          ]
        },
        {
          day: 'D5', date: '28/12/2026 (Mon)', items: [
            { text: '上午 陶阳里旅游区 + 景德镇御窑博物馆', type: 'spot', icon: '🏛️' },
            { text: 'G3327 12:53 ~ 18:14 景德镇北 to 深圳北', type: 'transport', icon: '🚅' }
          ]
        }
      ]
    };

    // 格式化數字
    function fmt(num) {
      return '¥' + Number(num).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // 計算結算與餘額
    function computeBalances() {
      const totalAmount = state.expenses.reduce((s, e) => s + Number(e.amount || 0), 0);
      const perShare = totalAmount / MEMBERS.length;

      const memberStats = {};
      MEMBERS.forEach(m => {
        memberStats[m] = { paid: 0, share: 0, net: 0 };
      });

      state.expenses.forEach(e => {
        const amt = Number(e.amount || 0);
        const payer = e.paidBy || 'Winson';
        if (memberStats[payer]) {
          memberStats[payer].paid += amt;
        }

        if (e.shares && Object.keys(e.shares).length > 0) {
          MEMBERS.forEach(m => {
            memberStats[m].share += Number(e.shares[m] || 0);
          });
        } else {
          const even = amt / MEMBERS.length;
          MEMBERS.forEach(m => {
            memberStats[m].share += even;
          });
        }
      });

      MEMBERS.forEach(m => {
        memberStats[m].net = memberStats[m].paid - memberStats[m].share;
      });

      return { totalAmount, perShare, memberStats };
    }

    // 渲染 UI
    function render() {
      const { totalAmount, perShare, memberStats } = computeBalances();
      const myStats = memberStats[currentUser] || { paid: 0, share: 0, net: 0 };

      // Top bar
      document.getElementById('topUserName').textContent = currentUser;
      document.getElementById('topAvatar').textContent = currentUser.charAt(0);
      document.getElementById('summaryUserName').textContent = currentUser;

      // Summary Card
      const net = myStats.net;
      const netEl = document.getElementById('summaryNetBalance');

      if (net > 0) {
        netEl.className = 'summary-balance';
        netEl.innerHTML = `+ ${fmt(net)} <span class="summary-balance-desc">(應收回)</span>`;
      } else if (net < 0) {
        netEl.className = 'summary-balance negative';
        netEl.innerHTML = `- ${fmt(Math.abs(net))} <span class="summary-balance-desc">(應給付)</span>`;
      } else {
        netEl.className = 'summary-balance';
        netEl.style.color = 'var(--text-muted)';
        netEl.innerHTML = `¥0.00 <span class="summary-balance-desc">(已結清)</span>`;
      }

      document.getElementById('totalExpenseVal').textContent = fmt(totalAmount);
      document.getElementById('perPersonVal').textContent = fmt(perShare);
      document.getElementById('userPaidVal').textContent = fmt(myStats.paid);

      // 開銷列表
      document.getElementById('expenseCount').textContent = state.expenses.length;
      const expenseContainer = document.getElementById('expenseContainer');
      expenseContainer.innerHTML = state.expenses.map(exp => {
        let icon = '🏷️';
        if (exp.type === '住宿') icon = '🏨';
        else if (exp.type === '交通') icon = '🚅';
        else if (exp.type === '餐飲') icon = '🍽️';
        else if (exp.type === '門票') icon = '🎟️';

        return `
          <div class="expense-card">
            <div class="expense-icon-box">${icon}</div>
            <div class="expense-info">
              <div class="expense-name">${exp.desc}</div>
              <div class="expense-meta">${exp.date} • ${exp.remark || exp.type}</div>
            </div>
            <div class="expense-right">
              <div class="expense-amount">${fmt(exp.amount)}</div>
              <div class="expense-payer">${exp.paidBy} 墊付</div>
            </div>
          </div>
        `;
      }).join('');

      // 行程列表
      const itineraryContainer = document.getElementById('itineraryContainer');
      itineraryContainer.innerHTML = state.itinerary.map(day => `
        <div class="day-card">
          <div class="day-header">
            <span class="day-badge">${day.day}</span>
            <span class="day-date">${day.date}</span>
          </div>
          ${day.items.map(it => `
            <div class="itinerary-item ${it.type}">
              <span>${it.icon || '📍'}</span>
              <span>${it.text}</span>
            </div>
          `).join('')}
        </div>
      `).join('');

      // 餘額列表
      const balancesContainer = document.getElementById('balancesContainer');
      balancesContainer.innerHTML = MEMBERS.map(m => {
        const s = memberStats[m];
        const isMe = m === currentUser;
        const isPositive = s.net > 0;
        const isNegative = s.net < 0;

        return `
          <div class="balance-card">
            <div class="member-info">
              <div class="member-avatar">${m.charAt(0)}</div>
              <div class="member-details">
                <div class="member-name">${m} ${isMe ? '<span style="font-size:12px;color:var(--accent);">(你)</span>' : ''}</div>
                <div class="member-sub">墊付 ${fmt(s.paid)} ｜ 應付 ${fmt(s.share)}</div>
              </div>
            </div>
            <div class="balance-net">
              <div class="balance-amount" style="color: ${isPositive ? 'var(--green)' : isNegative ? 'var(--red)' : 'var(--text-muted)'}">
                ${isPositive ? '+' : isNegative ? '-' : ''} ${fmt(Math.abs(s.net))}
              </div>
              <div class="balance-badge" style="color: ${isPositive ? 'var(--green)' : isNegative ? 'var(--red)' : 'var(--text-muted)'}">
                ${isPositive ? '應收回' : isNegative ? '應支付' : '已結清'}
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 找數指南 (Splitwise 最簡找數算法)
      const settleContainer = document.getElementById('settleContainer');
      const debtors = [];
      const creditors = [];

      MEMBERS.forEach(m => {
        const netVal = memberStats[m].net;
        if (netVal < -0.01) debtors.push({ name: m, amount: -netVal });
        else if (netVal > 0.01) creditors.push({ name: m, amount: netVal });
      });

      const settlements = [];
      let i = 0, j = 0;
      while (i < debtors.length && j < creditors.length) {
        const deb = debtors[i];
        const cred = creditors[j];
        const amt = Math.min(deb.amount, cred.amount);

        settlements.push({ from: deb.name, to: cred.name, amount: amt });
        deb.amount -= amt;
        cred.amount -= amt;

        if (deb.amount < 0.01) i++;
        if (cred.amount < 0.01) j++;
      }

      if (settlements.length === 0) {
        settleContainer.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:20px;">所有款項均已結清！</div>';
      } else {
        settleContainer.innerHTML = settlements.map(st => `
          <div class="settle-card">
            <div class="settle-flow">
              <span>${st.from}</span>
              <span class="settle-arrow">➜</span>
              <span>${st.to}</span>
            </div>
            <div class="settle-amount">${fmt(st.amount)}</div>
          </div>
        `).join('');
      }
    }

    // Tab 切換
    function switchTab(tabName, btn) {
      document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('tab-itinerary').style.display = tabName === 'itinerary' ? 'block' : 'none';
      document.getElementById('tab-expense').style.display = tabName === 'expense' ? 'block' : 'none';
      document.getElementById('tab-balances').style.display = tabName === 'balances' ? 'block' : 'none';
      document.getElementById('tab-settle').style.display = tabName === 'settle' ? 'block' : 'none';
    }

    // 使用者選擇 Modal
    function openUserModal() {
      const modalList = document.getElementById('modalUserList');
      modalList.innerHTML = MEMBERS.map(m => `
        <div class="modal-user-btn ${m === currentUser ? 'active' : ''}" onclick="selectUser('${m}')">
          <div class="user-avatar" style="width:28px;height:28px;font-size:13px;">${m.charAt(0)}</div>
          <span>${m}</span>
          ${m === currentUser ? '<span style="margin-left:auto;color:var(--accent);">✓</span>' : ''}
        </div>
      `).join('');
      document.getElementById('userModal').style.display = 'flex';
    }

    function closeUserModal(e) {
      document.getElementById('userModal').style.display = 'none';
    }

    function selectUser(name) {
      currentUser = name;
      localStorage.setItem('active_user', name);
      document.getElementById('userModal').style.display = 'none';
      render();
    }

    // GViz JSONP 動態載入器 (帶時間戳防快取)
    function fetchSheetJSONP(sheetName) {
      return new Promise((resolve, reject) => {
        const callbackName = 'gviz_cb_' + Math.floor(Math.random() * 10000000);
        const script = document.createElement('script');
        const timestamp = Date.now();

        script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}&sheet=${encodeURIComponent(sheetName)}&tq=&_=${timestamp}`;

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('連線超時'));
        }, 8000);

        function cleanup() {
          clearTimeout(timer);
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[callbackName] = function(data) {
          cleanup();
          if (data && data.table) resolve(data.table);
          else reject(new Error('回傳格式錯誤'));
        };

        script.onerror = function(err) {
          cleanup();
          reject(err);
        };

        document.head.appendChild(script);
      });
    }

    // 解析 Google Sheet Expense 表 (嚴格排除底部統計與結算摘要列)
    function parseExpenses(table) {
      const rows = table.rows || [];
      const newExpenses = [];

      for (let i = 0; i < rows.length; i++) {
        const r = rows[i].c;
        if (!r) continue;

        const type = r[0] ? String(r[0].v || '').trim() : '';
        const rawDate = r[1] ? String(r[1].f || r[1].v || '').trim() : '';
        const desc = r[2] ? String(r[2].v || '').trim() : '';

        // 關鍵過濾 1：遇到「總計」或「【」說明已進入底部結算統計區，直接結束讀取支出項目
        if (desc.includes('總計') || desc.includes('【')) {
          break;
        }

        // 關鍵過濾 2：標題列跳過
        if (!desc || desc === 'Description') continue;

        // 關鍵過濾 3：真實開銷必定有「日期」或「支出類別」，且項目名稱不可只是成員名字
        if (!rawDate && !type) continue;
        if (MEMBERS.includes(desc) && !rawDate) continue;

        const amount = r[3] ? parseFloat(r[3].v) : NaN;
        if (isNaN(amount) || amount <= 0) continue;

        const paidBy = (r[4] && String(r[4].v || '').trim()) ? String(r[4].v).trim() : 'Winson';
        const remark = r[5] ? String(r[5].v || '').trim() : '';

        // 讀取個別成員自訂分攤金額 (Col G~J)
        const shares = {};
        let hasCustomShares = false;
        MEMBERS.forEach((m, idx) => {
          const colIdx = 6 + idx;
          if (r[colIdx] && r[colIdx].v !== null && r[colIdx].v !== undefined) {
            const sVal = parseFloat(r[colIdx].v);
            if (!isNaN(sVal)) {
              shares[m] = sVal;
              hasCustomShares = true;
            }
          }
        });

        newExpenses.push({
          type: type || '其他',
          date: rawDate,
          desc: desc,
          amount: amount,
          paidBy: paidBy,
          remark: remark,
          shares: hasCustomShares ? shares : null
        });
      }

      if (newExpenses.length > 0) {
        state.expenses = newExpenses;
      }
    }

    // 解析 Google Sheet Itinerary 表
    function parseItinerary(table) {
      const rows = table.rows || [];
      const newItinerary = [];
      let currentDay = null;

      for (let i = 0; i < rows.length; i++) {
        const r = rows[i].c;
        if (!r) continue;

        const weekday = r[0] ? String(r[0].v || '') : '';
        const date = r[1] ? String(r[1].f || r[1].v || '') : '';
        const dayTag = r[2] ? String(r[2].v || '') : '';
        const detail = r[3] ? String(r[3].v || '').trim() : '';

        if (dayTag && dayTag.startsWith('D')) {
          currentDay = {
            day: dayTag,
            date: date ? `${date} (${weekday})` : dayTag,
            items: []
          };
          newItinerary.push(currentDay);
        }

        if (detail && currentDay) {
          let itemType = 'spot';
          let itemIcon = '📍';

          if (/G\d+|高鐵|車|Taxi|的士|交通/i.test(detail)) {
            itemType = 'transport';
            itemIcon = '🚅';
          } else if (/酒店|賓館/i.test(detail)) {
            itemType = 'hotel';
            itemIcon = '🏨';
          } else if (/Dinner|餐|食|早餐|晚餐/i.test(detail)) {
            itemType = 'food';
            itemIcon = '🍽️';
          } else if (/峰|頂|海|石|橋|亭|索道|博覽|博物館|街區/i.test(detail)) {
            itemType = 'spot';
            itemIcon = '⛰️';
          }

          currentDay.items.push({ text: detail, type: itemType, icon: itemIcon });
        }
      }

      if (newItinerary.length > 0) {
        state.itinerary = newItinerary;
      }
    }

    // 觸發刷新
    async function triggerRefresh() {
      const icon = document.getElementById('refreshIcon');
      const syncText = document.getElementById('syncText');
      const statusDot = document.getElementById('statusDot');

      icon.classList.add('spin');
      syncText.textContent = '正在同步 Google Sheet 最新數據...';
      statusDot.style.background = '#eab308';
      statusDot.style.boxShadow = '0 0 8px #eab308';

      try {
        const [expTable, itinTable] = await Promise.all([
          fetchSheetJSONP('Expense'),
          fetchSheetJSONP('Itinerary')
        ]);

        parseExpenses(expTable);
        parseItinerary(itinTable);

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        syncText.textContent = `已即時同步自 Google Sheet (${timeStr})`;
        statusDot.style.background = 'var(--green)';
        statusDot.style.boxShadow = '0 0 8px var(--green)';
      } catch (err) {
        console.warn('Google Sheet 同步未果，使用本機最新快取展示:', err);
        syncText.textContent = '已展示最新快照 (離線/快取模式)';
        statusDot.style.background = '#3b82f6';
        statusDot.style.boxShadow = '0 0 8px #3b82f6';
      } finally {
        icon.classList.remove('spin');
        render();
      }
    }

    // 頁面初次載入
    window.addEventListener('DOMContentLoaded', () => {
      render();
      triggerRefresh();
    });
  </script>
</body>
