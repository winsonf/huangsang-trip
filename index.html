<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>黃山 & 景德鎮 2026 聖誕之旅</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-inner: #1a243d;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #10b981;
      --danger: #f43f5e;
      --indigo: #6366f1;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #030712; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    
    .app-screen {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      border-left: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
    }

    .top-bar {
      padding: 16px 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      padding: 5px 12px 5px 6px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }
    .user-pill .mini-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .user-pill span { font-size: 12px; font-weight: 600; color: #e2e8f0; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .sync-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: #38bdf8;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .trip-tag {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }

    /* 頂部 4 粒分頁列 (避開右下角 Netlify 浮水印) */
    .top-nav-bar {
      margin: 8px 16px 14px;
      display: flex;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 4px;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .nav-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-sub);
      padding: 9px 2px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
    .nav-btn.active {
      background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(79, 70, 229, 0.4);
    }
    .nav-icon { font-size: 14px; }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 40px;
    }

    .wallet-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 60%, #1e293b 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 22px 18px;
      position: relative;
      overflow: hidden;
      margin-bottom: 20px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.4);
    }
    .wallet-label { font-size: 13px; color: #94a3b8; font-weight: 500; }
    .wallet-balance {
      font-size: 2.1rem;
      font-weight: 800;
      color: #34d399;
      letter-spacing: -0.03em;
      margin: 8px 0 14px;
    }
    .wallet-balance span { font-size: 0.95rem; font-weight: 500; color: #a7f3d0; margin-left: 4px; }
    .wallet-meta {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
    }
    .wallet-meta-col .title { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .wallet-meta-col .num { font-size: 13px; font-weight: 700; color: #f1f5f9; }

    .tab-section { display: none; }
    .tab-section.active { display: block; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .block-header { margin-bottom: 12px; }
    .block-title { font-size: 14px; font-weight: 700; color: #e2e8f0; }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    /* 行程專用卡片 */
    .day-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    }
    .day-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .day-badge {
      background: linear-gradient(135deg, #4f46e5, #3b82f6);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      letter-spacing: 0.05em;
    }
    .day-date {
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .day-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .itinerary-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      background: var(--card-inner);
      padding: 12px 14px;
      border-radius: 12px;
      border-left: 3px solid #6366f1;
    }
    .itinerary-item.type-transport { border-left-color: #38bdf8; }
    .itinerary-item.type-hotel { border-left-color: #10b981; }
    .itinerary-item.type-time { border-left-color: #f59e0b; }
    .itinerary-item.type-spot { border-left-color: #a855f7; }

    .itinerary-icon {
      font-size: 18px;
      line-height: 1.2;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .itinerary-text {
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.5;
      word-break: break-word;
    }

    /* 開銷明細 */
    .item-row {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      gap: 14px;
    }
    .item-row:last-child { border-bottom: none; }
    .item-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--card-inner);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .item-desc { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .item-amt-box { text-align: right; }
    .item-amt { font-size: 15px; font-weight: 700; color: #f8fafc; }
    .item-sub { font-size: 11px; color: #38bdf8; margin-top: 2px; }

    /* 成員結算 */
    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
    }
    .member-row:last-child { border-bottom: none; }
    .member-left { display: flex; align-items: center; gap: 12px; }
    .member-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-inner);
      color: #cbd5e1;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-status {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }
    .status-pos { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-neg { background: rgba(244, 63, 94, 0.15); color: #fb7185; }

    .settle-card {
      background: var(--card-inner);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .settle-flow { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .settle-arrow { color: #818cf8; }
    .settle-amt { font-size: 15px; font-weight: 800; color: #38bdf8; }

    .sync-status { font-size: 11px; color: var(--text-sub); text-align: center; margin-top: 15px; }

    #netlify-badge, .netlify-badge, [class*="netlify-badge"] {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>

    <div class="main-content" id="main-content">

  <script>

    const SPREADSHEET_ID = "1iZyozCgyjVUB7bGz-AmnQfYgAdv-XwzwnzYilRDehKc";

    // 初始基準數據（包含你剛更新的 D1 行程）
    const initialData = {

      expenses: [
        { type: "住宿", desc: "黃山風景區南大門換乘中心亞朵酒店", date: "2026-12-24", remark: "2間 高級雙床房", amount: 615.00, payer: "Winson" },
        { type: "住宿", desc: "黃山白雲賓館", date: "2026-12-25", remark: "2間 B區特惠標間 (早晚)", amount: 3166.00, payer: "Winson" }
      ],
      members: [
        { name: "Winson", paid: 3781.00, owed: 945.25, net: 2835.75 },
        { name: "Shirn", paid: 0.00, owed: 945.25, net: -945.25 },
        { name: "Bobo", paid: 0.00, owed: 945.25, net: -945.25 },
        { name: "秋明", paid: 0.00, owed: 945.25, net: -945.25 }
      ],
      transfers: [
        { from: "Shirn", to: "Winson", amount: 945.25 },
        { from: "Bobo", to: "Winson", amount: 945.25 },
        { from: "秋明", to: "Winson", amount: 945.25 }
      ],
      itinerary: [
        {
          day: "D1",
          date: "24/12/2026",
          weekday: "Thur",
          items: [
            "G902 11:35 to 17:06 香港西九龍 to 黃山北",
            "黄山风景区南大门换乘中心亚朵酒店 (RMB 315)",
            "Dinner at 徽菜館"
          ]
        },
        {
          day: "D2",
          date: "25/12/2026",
          weekday: "Fri",
          items: [
            "06:00 wake up, 06:30 leave hotel, 新國線景區交通(單程13元) or Taxi to 云谷寺站 (30 Mins)",
            "白鵝新站—琴忪—始信峰—清涼台—獅子峰頂——西海—排雲亭—飛來石—光明頂 (日落)—白雲賓館",
            "白雲賓館 (RMB 1580)"
          ]
        },
        {
          day: "D3",
          date: "26/12/2026",
          weekday: "Sat",
          items: [
            "05:30 Wake up, 06:00 出發到光明頂看日出",
            "白雲賓館—光明頂 —步仙桥—海心亭—鰲魚峰—一線天—玉屏樓—迎客松—玉屏索道—慈光閣",
            "慈光閣— 酒店 拿行李",
            "黃山北 — 景德镇北 Around 18:00 G1499 16:53 ~ 17:34",
            "汉庭酒店(景德镇陶阳里御窑厂店) (RMB 230)",
            "中山北路步行街"
          ]
        },
        {
          day: "D4",
          date: "27/12/2026",
          weekday: "Sun",
          items: [
            "上午 陶博城",
            "下午 景德镇古窑民俗博览区",
            "黃昏 陶溪川文创街区",
            "汉庭酒店(景德镇陶阳里御窑厂店) (RMB 230)"
          ]
        },
        {
          day: "D5",
          date: "28/12/2026",
          weekday: "Mon",
          items: [
            "上午 陶阳里旅游区 + 景德镇御窑博物馆",
            "G3327 12:53 ~ 18:14 景德镇北 to 深圳北"
          ]
        }
      ]
    };

    let activeTabId = 'itinerary';
    let currentData = initialData;

    function switchTab(tabId, el) {
      activeTabId = tabId;
      document.querySelectorAll('.tab-section').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.add('active');
      if (el) el.classList.add('active');
    }

    function getItemMeta(text) {
      if (/G\d+|高铁|高鐵|火车|火車|Taxi|交通|索道|單程|车|車/i.test(text)) {
        return { icon: '🚄', typeClass: 'type-transport', label: '交通' };
      }
      if (/酒店|宾馆|賓館|hotel/i.test(text)) {
        return { icon: '🏨', typeClass: 'type-hotel', label: '住宿' };
      }
      if (/wake up|出發|出发|leave/i.test(text)) {
        return { icon: '⏰', typeClass: 'type-time', label: '時間' };
      }
      return { icon: '📍', typeClass: 'type-spot', label: '行程' };
    }

    function getTypeIcon(type) {
      if (!type) return '💰';
      if (type.includes('住') || type.includes('酒店')) return '🏨';
      if (type.includes('食') || type.includes('餐') || type.includes('飯')) return '🍽️';
      if (type.includes('車') || type.includes('交通') || type.includes('高鐵') || type.includes('機票')) return '🚄';
      if (type.includes('門票') || type.includes('景點') || type.includes('索道')) return '⛰️';
      return '💰';
    }

    function renderUI(data, isLive = false) {
      currentData = data;
      const container = document.getElementById('main-content');
      container.innerHTML = `
        <div class="wallet-card">
          <div class="wallet-label">💰 你的結算狀態 (Winson)</div>
          <div class="wallet-balance" style="color:${data.winsonNet >= 0 ? '#34d399' : '#fb7185'}">
            ${data.winsonNet >= 0 ? '+ ¥' + data.winsonNet.toFixed(2) : '- ¥' + Math.abs(data.winsonNet).toFixed(2)}
            <span>(${data.winsonNet >= 0 ? '應收回' : '應支付'})</span>
          </div>
          <div class="wallet-meta">
            <div class="wallet-meta-col">
              <div class="title">行程總開銷</div>
              <div class="num">¥${data.total.toFixed(2)}</div>
            </div>
            <div class="wallet-meta-col">
              <div class="title">均攤/人</div>
              <div class="num">¥${data.perPerson.toFixed(2)}</div>
            </div>
            <div class="wallet-meta-col">
              <div class="title">你已墊付</div>
              <div class="num">¥${data.winsonPaid.toFixed(2)}</div>
            </div>
          </div>
        </div>

        <div id="tab-itinerary" class="tab-section ${activeTabId === 'itinerary' ? 'active' : ''}">
          <div class="block-header">
            <div class="block-title">🗺️ 行程規劃 (${data.itinerary.length} 天)</div>
          </div>
          ${data.itinerary.map(day => `
            <div class="day-card">
              <div class="day-header">
                <span class="day-badge">${day.day}</span>
                <span class="day-date">${day.date} (${day.weekday})</span>
              </div>
              <div class="day-items">
                ${day.items.map(item => {
                  const meta = getItemMeta(item);
                  return `
                    <div class="itinerary-item ${meta.typeClass}">
                      <span class="itinerary-icon">${meta.icon}</span>
                      <div class="itinerary-text">${item}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `).join('')}
        </div>

        <div id="tab-expenses" class="tab-section ${activeTabId === 'expenses' ? 'active' : ''}">
          <div class="block-header">
            <div class="block-title">🏨 支出紀錄 (${data.expenses.length})</div>
          </div>
          <div class="app-card">
            ${data.expenses.map(exp => `
              <div class="item-row">
                <div class="item-icon">${getTypeIcon(exp.type)}</div>
                <div class="item-info">
                  <div class="item-title">${exp.desc}</div>
                  <div class="item-desc">${exp.date} •${exp.remark}</div>
                </div>
                <div class="item-amt-box">
                  <div class="item-amt">¥${exp.amount.toFixed(2)}</div>
                  <div class="item-sub">${exp.payer} 墊付</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div id="tab-members" class="tab-section ${activeTabId === 'members' ? 'active' : ''}">
          <div class="block-header">
            <div class="block-title">👥 成員結算餘額</div>
          </div>
          <div class="app-card">
            ${data.members.map(m => `
              <div class="member-row">
                <div class="member-left">
                  <div class="member-avatar" style="${m.name === 'Winson' ? 'background:#064e3b; color:#34d399;' : ''}">${m.name.slice(0, 1)}</div>
                  <div>
                    <div style="font-size:14px; font-weight:600;">${m.name}${m.name === 'Winson' ? '(你)' : ''}</div>
                    <div style="font-size:11px; color:#64748b;">已墊付 ¥${m.paid.toFixed(2)} ｜ 應付 ¥${m.owed.toFixed(2)}</div>
                  </div>
                </div>
                <div class="badge-status ${m.net >= 0 ? 'status-pos' : 'status-neg'}">
                  ${m.net >= 0 ? '+ ¥' + m.net.toFixed(2) : '- ¥' + Math.abs(m.net).toFixed(2)}<br>
                  <span style="font-size:10px;">${m.net >= 0 ? '應收回' : '應支付'}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>

        <div id="tab-settle" class="tab-section ${activeTabId === 'settle' ? 'active' : ''}">
          <div class="block-header">
            <div class="block-title">⚡ 快速找數指南</div>
          </div>
          ${data.transfers.map(t => `
            <div class="settle-card">
              <div class="settle-flow">
                <span>${t.from}</span>
                <span class="settle-arrow">➜</span>
                <span>${t.to}</span>
              </div>
              <div class="settle-amt">¥${t.amount.toFixed(2)}</div>
            </div>
          `).join('')}
        </div>

        <div class="sync-status">
          ${isLive ? '🟢 數據已即時同步自 Google Sheet' : '🟢 數據已加載完成'}
        </div>
      `;
    }

    renderUI(initialData, false);

    // 解析 Google GViz Itinerary 表格
    function parseGVizItinerary(table) {
      const rows = table.rows || [];
      const days = [];
      let currentDay = null;

      for (let r of rows) {
        const cells = r.c || [];
        const vals = cells.map(c => (c && c.v !== null && c.v !== undefined) ? String(c.v).trim() : '');
        while (vals.length < 4) vals.push('');

        const [col0, col1, col2, col3] = vals;

        let dayMarker = '';
        for (let idx = 0; idx < Math.min(3, vals.length); idx++) {
          const v = vals[idx].toUpperCase();
          if (/^D\d+$/i.test(v)) {
            dayMarker = vals[idx];
            break;
          }
        }

        if (dayMarker) {
          const weekday = col0 !== dayMarker ? col0 : '';
          const dateStr = col1 !== dayMarker ? col1 : '';
          currentDay = {
            day: dayMarker,
            weekday: weekday,
            date: dateStr,
            items: []
          };
          days.push(currentDay);
        }

        let itemText = col3;
        if (!itemText && !dayMarker) {
          itemText = vals.find(v => v !== '') || '';
        }

        if (itemText && currentDay) {
          currentDay.items.push(itemText);
        }
      }
      return days.length > 0 ? days : null;
    }

    // 跨域零限制 JSONP 載入器
    function loadSheetJSONP(sheetName, callbackName) {
      const oldScript = document.getElementById('script-' + callbackName);
      if (oldScript) oldScript.remove();
      const script = document.createElement('script');
      script.id = 'script-' + callbackName;
      script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?sheet=${encodeURIComponent(sheetName)}&tqx=responseHandler:${callbackName}&t=${Date.now()}`;
      document.body.appendChild(script);
    }

    // Itinerary 回調處理
    window.handleItineraryResponse = function(response) {
      if (response && response.table) {
        const parsedDays = parseGVizItinerary(response.table);
        if (parsedDays && parsedDays.length > 0) {
          currentData.itinerary = parsedDays;
          renderUI(currentData, true);
        }
      }
    };

    // 觸發全自動即時刷新
    function fetchLiveUpdates() {
      loadSheetJSONP('Itinerary', 'handleItineraryResponse');
    }

    // 頁面載入後自動向 Google 發送即時更新請求
    setTimeout(fetchLiveUpdates, 500);
  </script>
</body>
</html>
