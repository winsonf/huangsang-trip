<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>黃山 2026 聖誕分帳</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-inner: #1a243d;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --primary: #10b981;
      --danger: #f43f5e;
      --indigo: #6366f1;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #030712; color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
    
    .app-screen {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      border-left: 1px solid rgba(255,255,255,0.05);
      border-right: 1px solid rgba(255,255,255,0.05);
    }
    .top-bar {
      padding: 16px 20px 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,0.07);
      padding: 5px 12px 5px 6px;
      border-radius: 9999px;
      border: 1px solid var(--border);
    }
    .user-pill .mini-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }
    .user-pill span { font-size: 12px; font-weight: 600; color: #e2e8f0; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .sync-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      color: #38bdf8;
      font-size: 12px;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .trip-tag {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
    }
    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 10px 18px 100px;
    }
    .wallet-card {
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 60%, #1e293b 100%);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      padding: 24px 20px;
      position: relative;
      overflow: hidden;
      margin-bottom: 22px;
      box-shadow: 0 16px 36px rgba(0,0,0,0.4);
    }
    .wallet-label { font-size: 13px; color: #94a3b8; font-weight: 500; }
    .wallet-balance {
      font-size: 2.1rem;
      font-weight: 800;
      color: #34d399;
      letter-spacing: -0.03em;
      margin: 8px 0 16px;
    }
    .wallet-balance span { font-size: 0.95rem; font-weight: 500; color: #a7f3d0; margin-left: 4px; }
    .wallet-meta {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 14px;
    }
    .wallet-meta-col .title { font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .wallet-meta-col .num { font-size: 13px; font-weight: 700; color: #f1f5f9; }

    .tab-section { display: none; }
    .tab-section.active { display: block; }
    .block-header { margin-bottom: 12px; }
    .block-title { font-size: 14px; font-weight: 700; color: #e2e8f0; }

    .app-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .item-row {
      display: flex;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      gap: 14px;
    }
    .item-row:last-child { border-bottom: none; }
    .item-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: var(--card-inner);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-size: 14px; font-weight: 600; color: #f8fafc; }
    .item-desc { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .item-amt-box { text-align: right; }
    .item-amt { font-size: 15px; font-weight: 700; color: #f8fafc; }
    .item-sub { font-size: 11px; color: #38bdf8; margin-top: 2px; }

    .member-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 16px;
      border-bottom: 1px solid var(--border);
    }
    .member-row:last-child { border-bottom: none; }
    .member-left { display: flex; align-items: center; gap: 12px; }
    .member-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--card-inner);
      color: #cbd5e1;
      font-weight: 700;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .badge-status {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: right;
    }
    .status-pos { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .status-neg { background: rgba(244, 63, 94, 0.15); color: #fb7185; }

    .settle-card {
      background: var(--card-inner);
      padding: 16px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      border: 1px solid var(--border);
    }
    .settle-flow { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
    .settle-arrow { color: #818cf8; }
    .settle-amt { font-size: 15px; font-weight: 800; color: #38bdf8; }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(19, 27, 46, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 10px;
      z-index: 50;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }
    .nav-btn.active { color: #38bdf8; }
    .nav-icon { font-size: 20px; }
    .loading-state { text-align: center; padding: 40px 20px; color: var(--text-sub); font-size: 14px; }
  </style>
</head>
<body>

  <div class="app-screen">
    
    <div class="top-bar">
      <div class="user-pill">
        <div class="mini-avatar">W</div>
        <span>Winson</span>
      </div>
      <div class="top-actions">
        <button class="sync-btn" onclick="fetchSheetData()">🔄 更新</button>
        <div class="trip-tag">🏔️ 黃山 2026</div>
      </div>
    </div>

    <div class="main-content" id="main-content">
      <div class="loading-state">⏳ 正在即時同步 Google Sheet 最新資料...</div>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn active" onclick="switchTab('expenses', this)">
        <span class="nav-icon">📊</span>
        <span>開銷明細</span>
      </button>
      <button class="nav-btn" onclick="switchTab('members', this)">
        <span class="nav-icon">👥</span>
        <span>成員餘額</span>
      </button>
      <button class="nav-btn" onclick="switchTab('settle', this)">
        <span class="nav-icon">⚡</span>
        <span>結算找數</span>
      </button>
    </div>

  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTuGxEnhn9Fhd9HBAevje_UD7daQfoo58i21z41apXr0x6mDM0qcR36bbYQcDoOZUZa-t0-pbFPQqEb/pub?output=csv";
    let activeTabId = 'expenses';

    function switchTab(tabId, el) {
      activeTabId = tabId;
      document.querySelectorAll('.tab-section').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      const target = document.getElementById('tab-' + tabId);
      if (target) target.classList.add('active');
      if (el) el.classList.add('active');
    }

    function parseCSV(str) {
      const arr = [];
      let quote = false;
      let row = [''];
      let col = 0;
      for (let c of str) {
        if (c === '"') {
          quote = !quote;
        } else if (c === ',' && !quote) {
          row.push('');
          col++;
        } else if (c === '\r') {
        } else if (c === '\n' && !quote) {
          arr.push(row);
          row = [''];
          col = 0;
        } else {
          row[col] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') arr.push(row);
      return arr;
    }

    function getTypeIcon(type) {
      if (!type) return '💰';
      if (type.includes('住') || type.includes('酒店')) return '🏨';
      if (type.includes('食') || type.includes('餐') || type.includes('飯')) return '🍽️';
      if (type.includes('車') || type.includes('交通') || type.includes('高鐵') || type.includes('機票')) return '🚄';
      if (type.includes('門票') || type.includes('景點') || type.includes('索道')) return '⛰️';
      return '💰';
    }

    async function fetchSheetData() {
      const container = document.getElementById('main-content');
      try {
        const res = await fetch(CSV_URL + '&t=' + Date.now(), { cache: 'no-cache' });
        const csvText = await res.text();
        const rows = parseCSV(csvText);

        if (!rows || rows.length < 2) throw new Error("試算表數據為空");

        const headers = rows[0].map(h => (h || '').trim());
        const members = [];
        for (let j = 6; j < headers.length; j++) {
          if (headers[j] && !headers[j].includes('總計')) {
            members.push({ name: headers[j], colIdx: j });
          }
        }
        if (members.length === 0) {
          members.push({ name: 'Winson', colIdx: 6 }, { name: 'Shirn', colIdx: 7 }, { name: 'Bobo', colIdx: 8 }, { name: '秋明', colIdx: 9 });
        }

        const expenses = [];
        let totalAmount = 0;
        const paidMap = {};
        const owedMap = {};
        members.forEach(m => { paidMap[m.name] = 0; owedMap[m.name] = 0; });

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const type = (row[0] || '').trim();
          const desc = (row[2] || '').trim();
          if (type.includes('總計') || type.includes('【') || desc.includes('總計') || desc.includes('【')) break;

          const amtStr = (row[3] || '').replace(/[^0-9.-]/g, '');
          const amt = parseFloat(amtStr);
          if (isNaN(amt) || amt <= 0) continue;

          const payer = (row[4] || 'Winson').trim();
          const date = (row[1] || '').trim();
          const remark = (row[5] || '').trim();

          expenses.push({ type, date, desc, amount: amt, payer, remark, row });
          totalAmount += amt;

          if (paidMap[payer] !== undefined) paidMap[payer] += amt;
          else paidMap[payer] = amt;

          let hasSplit = false;
          members.forEach(m => {
            const val = parseFloat((row[m.colIdx] || '').replace(/[^0-9.-]/g, ''));
            if (!isNaN(val) && val > 0) hasSplit = true;
          });

          members.forEach(m => {
            if (hasSplit) {
              const val = parseFloat((row[m.colIdx] || '').replace(/[^0-9.-]/g, ''));
              owedMap[m.name] += (!isNaN(val) ? val : 0);
            } else {
              owedMap[m.name] += amt / members.length;
            }
          });
        }

        const balances = members.map(m => {
          const paid = paidMap[m.name] || 0;
          const owed = owedMap[m.name] || 0;
          return { name: m.name, paid, owed, net: paid - owed };
        });

        // 找數演算法
        const debtors = [];
        const creditors = [];
        balances.forEach(b => {
          const net = Math.round(b.net * 100) / 100;
          if (net < -0.01) debtors.push({ name: b.name, amount: -net });
          else if (net > 0.01) creditors.push({ name: b.name, amount: net });
        });
        debtors.sort((a,b) => b.amount - a.amount);
        creditors.sort((a,b) => b.amount - a.amount);

        const transfers = [];
        let d = 0, c = 0;
        while (d < debtors.length && c < creditors.length) {
          const deb = debtors[d];
          const cred = creditors[c];
          const st = Math.min(deb.amount, cred.amount);
          if (st > 0.01) transfers.push({ from: deb.name, to: cred.name, amount: st });
          deb.amount -= st;
          cred.amount -= st;
          if (deb.amount <= 0.01) d++;
          if (cred.amount <= 0.01) c++;
        }

        const winsonBal = balances.find(b => b.name.toLowerCase() === 'winson') || { net: 0, paid: 0 };
        const perPerson = totalAmount / (members.length || 1);

        // 渲染 HTML
        container.innerHTML = `
          <div class="wallet-card">
            <div class="wallet-label">💰 你的結算狀態 (Winson)</div>
            <div class="wallet-balance" style="color:${winsonBal.net >= 0 ? '#34d399' : '#fb7185'}">
              ${winsonBal.net >= 0 ? '+ ¥' + winsonBal.net.toFixed(2) : '- ¥' + Math.abs(winsonBal.net).toFixed(2)}
              <span>(${winsonBal.net >= 0 ? '應收回' : '應支付'})</span>
            </div>
            <div class="wallet-meta">
              <div class="wallet-meta-col">
                <div class="title">行程總開銷</div>
                <div class="num">¥${totalAmount.toFixed(2)}</div>
              </div>
              <div class="wallet-meta-col">
                <div class="title">均攤/人</div>
                <div class="num">¥${perPerson.toFixed(2)}</div>
              </div>
              <div class="wallet-meta-col">
                <div class="title">你已墊付</div>
                <div class="num">¥${winsonBal.paid.toFixed(2)}</div>
              </div>
            </div>
          </div>

          <div id="tab-expenses" class="tab-section ${activeTabId === 'expenses' ? 'active' : ''}">
            <div class="block-header">
              <div class="block-title">🏨 支出紀錄 (${expenses.length})</div>
            </div>
            <div class="app-card">
              ${expenses.map(exp => `
                <div class="item-row">
                  <div class="item-icon">${getTypeIcon(exp.type)}</div>
                  <div class="item-info">
                    <div class="item-title">${exp.desc}</div>
                    <div class="item-desc">${exp.date \vert{}\vert{} '未標註日期'} • ${exp.remark || exp.type}</div>
                  </div>
                  <div class="item-amt-box">
                    <div class="item-amt">¥${exp.amount.toFixed(2)}</div>
                    <div class="item-sub">${exp.payer} 墊付</div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div id="tab-members" class="tab-section ${activeTabId === 'members' ? 'active' : ''}">
            <div class="block-header">
              <div class="block-title">👥 成員結算餘額</div>
            </div>
            <div class="app-card">
              ${balances.map(b => `
                <div class="member-row">
                  <div class="member-left">
                    <div class="member-avatar" style="${b.name === 'Winson' ? 'background:#064e3b; color:#34d399;' : ''}">${b.name.slice(0, 1)}</div>
                    <div>
                      <div style="font-size:14px; font-weight:600;">${b.name}${b.name === 'Winson' ? '(你)' : ''}</div>
                      <div style="font-size:11px; color:#64748b;">已墊付 ¥${b.paid.toFixed(2)} ｜ 應付 ¥${b.owed.toFixed(2)}</div>
                    </div>
                  </div>
                  <div class="badge-status ${b.net >= 0 ? 'status-pos' : 'status-neg'}">
                    ${b.net >= 0 ? '+ ¥' + b.net.toFixed(2) : '- ¥' + Math.abs(b.net).toFixed(2)}<br>
                    <span style="font-size:10px;">${b.net >= 0 ? '應收回' : '應支付'}</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div id="tab-settle" class="tab-section ${activeTabId === 'settle' ? 'active' : ''}">
            <div class="block-header">
              <div class="block-title">⚡ 快速找數指南</div>
            </div>
            ${transfers.length === 0 ? '<div style="padding:20px; text-align:center; color:#94a3b8;">已全部找清！</div>' : transfers.map(t => `
              <div class="settle-card">
                <div class="settle-flow">
                  <span>${t.from}</span>
                  <span class="settle-arrow">➜</span>
                  <span>${t.to}</span>
                </div>
                <div class="settle-amt">¥${t.amount.toFixed(2)}</div>
              </div>
            `).join('')}
          </div>
        `;
      } catch (err) {
        container.innerHTML = `
          <div class="loading-state" style="color:#fb7185;">
            ❌ 連線同步失敗：${err.message}<br><br>
            <button class="sync-btn" style="margin: 0 auto;" onclick="fetchSheetData()">重新載入</button>
          </div>
        `;
      }
    }

    fetchSheetData();
  </script>
</body>
</html>
